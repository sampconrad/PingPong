minimum_pre_commit_version: "3.0.0"


repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua --config-path stylua.toml
        language: system
        types: [lua]
      - id: selene
        name: selene
        entry: selene --config selene.toml
        language: system
        types: [lua]
